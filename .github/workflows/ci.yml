name: "CI"

on:
  push:
    branches:
      - main
      - feature/TMSPKED-518-Implement-CD-via-Ansible
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test-build:
    runs-on: ubuntu-latest
    env:
      MPLBACKEND: Agg

    steps:
      - name: Setup repo
        uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          sudo apt-get clean
          docker system prune -af
          df -h

      - name: Setup python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: |
            requirements.lock.txt
            requirements.torcheeg.txt
            pyproject.toml        
        
      - name: Install CI tools
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install -r requirements.lock.txt
          pip install -r requirements.torcheeg.txt --no-deps
          pip install pytest ruff mypy build 

      - name: Static analysis
        run: |
          ruff check .

      - name: Run unit tests
        run: |
          pytest tests/unit
      
      - name: Training smoke tests
        run: |
          shopt -s nullglob
          configs=(configs/test/smoke/synthetic/*.yaml)

          if [ ${#configs[@]} -eq 0 ]; then
            echo "No smoke configs found in configs/test/smoke/synthetic/"
            exit 1
          fi

          for config in "${configs[@]}"; do
            name="${config#configs/}"
            name="${name%.yaml}"

            echo "Running smoke config: ${name}"
            python -m src.main --config-name "${name}"
          done

      - name: Build package
        run: | 
          python -m build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: python-package
          path: |
            dist/*.whl
            dist/*.tar.gz

      - name: Build Docker image
        run: |
          docker build \
            -t src:${{ github.sha }} \
            -t src:latest \
            .

      - name: Smoke test Docker image
        run: |
          docker run --rm src:${{ github.sha }} \
            python -m src.main --config-name test/smoke/synthetic/training_ml

  deploy-feature:
    needs: test-build
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/feature/TMSPKED-518-Implement-CD-via-Ansible' }}
    uses: ./.github/workflows/deploy.yml
    secrets: inherit
    permissions:
      contents: read
      packages: write
