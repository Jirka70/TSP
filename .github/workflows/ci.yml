name: "CI"

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test-build:
    runs-on: ubuntu-latest

    steps:
      - name: Setup repo
        uses: actions/checkout@v4

      - name: Setup python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install -r requirements.lock.txt
          pip install -r requirements.torcheeg.txt --no-deps
          pip install pytest ruff mypy build 

      - name: Static analysis
        run: |
          ruff check .

      - name: Run unit tests
        run: |
          pytest tests/unit
      
      - name: Training smoke tests
        run: |
          shopt -s nullglob
          configs=(configs/smoke/*.yaml)

          if [ ${#configs[@]} -eq 0 ]; then
            echo "No smoke configs found in configs/smoke/"
            exit 1
          fi

          for config in "${configs[@]}"; do
            name="${config#configs/}"
            name="${name%.yaml}"

            echo "Running smoke config: ${name}"
            python -m src.main --config-name "${name}"
          done

      - name: Build package
        run: | 
          python -m build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: python-package
          path: |
            dist/*.whl
            dist/*.tar.gz

      - name: Build Docker image
        run: |
          docker build \
            -t src:${{ github.sha }} \
            -t src:latest \
            .

      - name: Smoke test Docker image
        run: |
          docker run --rm src:${{ github.sha }}

      - name: Save Docker image
        run: |
          docker save \
            src:${{ github.sha }} \
            src:latest \
            -o src-image.tar

      - name: Upload Docker image artifact
        uses: actions/upload-artifact@v4
        with:
          name: docker-image
          path: src-image.tar



      
    
      
