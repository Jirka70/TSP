name: Deploy

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Existing immutable Docker tag for rollback, for example sha-abc1234."
        required: true
        type: string
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: deploy-staging
  cancel-in-progress: false

defaults:
  run:
    shell: bash --noprofile --norc -euo pipefail {0}

jobs:
  deploy:
    if: >-
      ${{
        github.event_name == 'workflow_dispatch' ||
        (
          github.event_name == 'workflow_run' &&
          github.event.workflow_run.conclusion == 'success' &&
          github.event.workflow_run.event == 'push' &&
          github.event.workflow_run.head_branch == 'main'
        )
      }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    environment: CD environment

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Compute deployment image
        id: image
        run: |
          source_sha="${{ github.event.workflow_run.head_sha || github.sha }}"
          requested_tag="${{ github.event.inputs.image_tag || '' }}"
          image_name="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/tsp-eeg-classification"

          if [ -z "$requested_tag" ]; then
            tag="sha-${source_sha}"
            should_build="true"
          else
            tag="$requested_tag"
            should_build="false"
          fi

          echo "source_sha=$source_sha" >> "$GITHUB_OUTPUT"
          echo "image_name=$image_name" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "image=$image_name:$tag" >> "$GITHUB_OUTPUT"
          echo "should_build=$should_build" >> "$GITHUB_OUTPUT"

      - name: Validate deployment secrets
        env:
          NUADA_SSH_HOST: ${{ secrets.NUADA_SSH_HOST }}
          NUADA_SSH_PRIVATE_KEY: ${{ secrets.NUADA_SSH_PRIVATE_KEY }}
          NUADA_SSH_USER: ${{ secrets.NUADA_SSH_USER }}
          NUADA_KNOWN_HOSTS: ${{ secrets.NUADA_KNOWN_HOSTS }}
        run: |
          missing=0

          for name in NUADA_SSH_HOST NUADA_SSH_PRIVATE_KEY NUADA_SSH_USER NUADA_KNOWN_HOSTS; do
            if [ -z "${!name-}" ]; then
              echo "::error::$name is not configured in the CD environment secrets"
              missing=1
            fi
          done

          exit "$missing"

      - name: Configure SSH
        env:
          NUADA_SSH_PRIVATE_KEY: ${{ secrets.NUADA_SSH_PRIVATE_KEY }}
          NUADA_KNOWN_HOSTS: ${{ secrets.NUADA_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          printf '%s\n' "$NUADA_SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519

          printf '%s\n' "$NUADA_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      - name: Verify SSH access
        env:
          NUADA_SSH_HOST: ${{ secrets.NUADA_SSH_HOST }}
          NUADA_SSH_USER: ${{ secrets.NUADA_SSH_USER }}
          NUADA_SSH_PORT: ${{ secrets.NUADA_SSH_PORT || '22' }}
        run: |
          ssh \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            -p "$NUADA_SSH_PORT" \
            "${NUADA_SSH_USER}@${NUADA_SSH_HOST}" \
            'sudo -n true'

      - name: Verify Nuada Docker capacity
        env:
          NUADA_SSH_HOST: ${{ secrets.NUADA_SSH_HOST }}
          NUADA_SSH_USER: ${{ secrets.NUADA_SSH_USER }}
          NUADA_SSH_PORT: ${{ secrets.NUADA_SSH_PORT || '22' }}
          MIN_DOCKER_FREE_GB: "8"
        run: |
          ssh \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            -p "$NUADA_SSH_PORT" \
            "${NUADA_SSH_USER}@${NUADA_SSH_HOST}" \
            "sudo -n sh -c 'docker system prune -af >/dev/null 2>&1 || true; path=/var/lib/docker; [ -d \"\$path\" ] || path=/; free_gb=\$(df -BG --output=avail \"\$path\" | tail -n 1 | tr -dc 0-9); echo \"Nuada free Docker space: \${free_gb}GB\"; [ \"\$free_gb\" -ge ${MIN_DOCKER_FREE_GB} ]'"

      - name: Free disk space
        if: ${{ steps.image.outputs.should_build == 'true' }}
        run: |
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          sudo apt-get clean
          docker system prune -af
          df -h

      - name: Log in to GHCR
        if: ${{ steps.image.outputs.should_build == 'true' }}
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        if: ${{ steps.image.outputs.should_build == 'true' }}
        uses: docker/setup-buildx-action@v3

      - name: Build and push Docker image
        if: ${{ steps.image.outputs.should_build == 'true' }}
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ steps.image.outputs.image }}
            ${{ steps.image.outputs.image_name }}:latest
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ steps.image.outputs.source_sha }}

      - name: Install Ansible
        run: |
          python -m pip install --upgrade pip
          pip install ansible

      - name: Install Ansible collections
        run: |
          ansible-galaxy collection install -r ansible/requirements.yml

      - name: Create runtime inventory
        env:
          NUADA_SSH_HOST: ${{ secrets.NUADA_SSH_HOST }}
          NUADA_SSH_USER: ${{ secrets.NUADA_SSH_USER }}
          NUADA_SSH_PORT: ${{ secrets.NUADA_SSH_PORT || '22' }}
        run: |
          cat > ansible/inventory.ini <<EOF
          [staging]
          nuada ansible_host=${NUADA_SSH_HOST} ansible_user=${NUADA_SSH_USER} ansible_port=${NUADA_SSH_PORT} ansible_python_interpreter=/usr/bin/python3
          EOF

      - name: Provision nuada
        run: |
          ansible-playbook ansible/playbooks/provision.yml

      - name: Deploy to nuada
        env:
          TSP_IMAGE: ${{ steps.image.outputs.image }}
          GHCR_USERNAME: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ansible-playbook ansible/playbooks/deploy.yml
