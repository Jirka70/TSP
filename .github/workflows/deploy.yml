name: Deploy

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Optional Docker tag for rollback e. g. (sha-abc123)"
        required: false
  push:
    branches: [main]

concurrency:
  group: deploy-staging
  cancel-in-progress: false

env:
  IMAGE_NAME: ghcr.io/${{ github.repository }}/tsp-eeg-classification

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: staging

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Compute immutable image tag
        id: image
        run: |
          TAG="${{ github.event.inputs.image_tag }}"
                    if [ -z "$TAG" ]; then
                      TAG="sha-${GITHUB_SHA}"
                    fi

                    echo "tag=$TAG" >> "$GITHUB_OUTPUT"
                    echo "image=${IMAGE_NAME}:${TAG}" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        if: ${{ github.event.inputs.image_tag == '' }}
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ steps.image.outputs.image }}
            ${{ env.IMAGE_NAME }}:latest

      - name: Install Ansible
        run: |
          python -m pip install --upgrade pip
          pip install ansible

      - name: Install Ansible collections
        run: |
          ansible-galaxy collection install -r ansible/requirements.yml
          
      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          
          printf '%s\n' "${{ secrets.NUADA_SSH_PRIVATE_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          
          printf '%s\n' "${{ secrets.NUADA_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

          - name: Create runtime inventory
            run: |
              cat > ansible/inventory.ini <<'EOF'
              [staging]
              nuada ansible_host=nuada.zu.cz ansible_user=${{ secrets.NUADA_SSH_USER }} ansible_python_interpreter=/usr/bin/python3
              EOF

          - name: Deploy to nuada
            env:
              TSP_IMAGE: ${{ steps.image.outputs.image }}
              GHCR_USERNAME: ${{ github.actor }}
              GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
            run: |
              ansible-playbook ansible/playbooks/deploy.yml