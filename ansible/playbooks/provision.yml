- name: Provision TSP host
  hosts: staging
  become: true
  gather_facts: true

  tasks:
    - name: Install Docker runtime packages
      ansible.builtin.apt:
        name: "{{ docker_runtime_packages }}"
        update_cache: true
        state: present

    - name: Ensure Docker service is enabled and running
      ansible.builtin.service:
        name: docker
        enabled: true
        state: started

    - name: Create application user
      ansible.builtin.user:
        name: "{{ app_user }}"
        system: true
        create_home: false
        shell: /usr/sbin/nologin
        groups: docker
        append: true

    - name: Allow SSH deploy user to manage Docker
      ansible.builtin.user:
        name: "{{ ansible_user }}"
        groups: docker
        append: true
      when:
        - ansible_user is defined
        - ansible_user not in ["root", app_user]

    - name: Create persistent application directories
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        owner: "{{ app_user }}"
        group: "{{ app_user }}"
        mode: "0755"
      loop: "{{ app_directories }}"
