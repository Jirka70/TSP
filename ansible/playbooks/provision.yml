- name: Provision TSP host
  hosts: staging
  become: true
  gather_facts: true

  vars:
    app_user: tsp
    app_dir: /opt/tsp

  tasks:
    - name: Install Docker runtime packages
      ansible.builtin.apt:
        name:
          - docker.io
          - python3-docker
        update_cache: true
        state: present

    - name: Ensure Docker service is enabled and running
      ansible.builtin.service:
        name: docker
        enabled: true
        state: started

    - name: Create application user
      ansible.builtin.user:
        name: "{{ app_user }}"
        system: true
        create_home: false
        shell: /usr/sbin/nologin
        groups: docker
        append: true

    - name: Create persistent application directories
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        owner: "{{ app_user }}"
        group: "{{ app_user }}"
        mode: "0755"
      loop:
        - "{{ app_dir }}"
        - "{{ app_dir }}/input"
        - "{{ app_dir }}/outputs"
        - "{{ app_dir }}/model_output"
        - "{{ app_dir }}/logs"
        - "{{ app_dir }}/bin"