- name: Deploy TSP Docker image
  hosts: staging
  become: true
  gather_facts: false

  vars:
    image: "{{ lookup('env', 'TSP_IMAGE') }}"
    ghcr_username: "{{ lookup('env', 'GHCR_USERNAME') }}"
    ghcr_token: "{{ lookup('env', 'GHCR_TOKEN') }}"

  pre_tasks:
    - name: Require immutable image reference
      ansible.builtin.assert:
        that:
          - image | length > 0
          - image is match('^ghcr\\.io/.+:.+$')
          - image is search(':sha-[0-9a-f]{7,40}$')
        fail_msg: "TSP_IMAGE must be a GHCR image with an immutable sha-* tag, for example ghcr.io/org/tsp-eeg-classification:sha-abc1234."

  tasks:
    - name: Ensure application directories exist
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        owner: "{{ app_user }}"
        group: "{{ app_user }}"
        mode: "0755"
      loop: "{{ app_directories }}"

    - name: Log in to GHCR
      community.docker.docker_login:
        registry_url: ghcr.io
        username: "{{ ghcr_username }}"
        password: "{{ ghcr_token }}"
        reauthorize: true
      no_log: true
      when:
        - ghcr_username | length > 0
        - ghcr_token | length > 0

    - name: Remove unused Docker data before pulling image
      ansible.builtin.command: docker system prune -af
      register: docker_prune_result
      changed_when: "'Total reclaimed space: 0B' not in docker_prune_result.stdout"

    - name: Check free space for Docker images
      ansible.builtin.shell: "df -BG --output=avail /var/lib/docker | tail -n 1 | tr -dc '0-9'"
      register: docker_free_space_result
      changed_when: false

    - name: Require enough free Docker disk space
      ansible.builtin.assert:
        that:
          - docker_free_space_result.stdout | int >= min_docker_free_gb
        fail_msg: >-
          Docker has only {{ docker_free_space_result.stdout }}GB free in /var/lib/docker.
          Increase the VM disk to at least 20GB or clean Docker data before deploying.

    - name: Pull requested application image
      ansible.builtin.command: "docker pull {{ image }}"
      register: docker_pull_result
      async: 1800
      poll: 10
      changed_when: >-
        'Downloaded newer image' in docker_pull_result.stdout
        or 'Pull complete' in docker_pull_result.stdout
        or 'Pull complete' in docker_pull_result.stderr

    - name: Write batch runner script
      ansible.builtin.copy:
        dest: "{{ app_dir }}/bin/tsp-run"
        owner: "{{ app_user }}"
        group: "{{ app_user }}"
        mode: "0755"
        content: |
          #!/usr/bin/env bash
          set -euo pipefail

          app_uid="$(id -u "{{ app_user }}")"
          app_gid="$(getent group "{{ app_user }}" | cut -d: -f3)"

          exec docker run --rm \
            --user "${app_uid}:${app_gid}" \
            -e HOME=/tmp \
            -e MPLBACKEND=Agg \
            -v {{ app_dir }}/data:/app/data \
            -v {{ app_dir }}/input:/app/input:ro \
            -v {{ app_dir }}/outputs:/app/outputs \
            -v {{ app_dir }}/model_output:/app/model_output \
            -v {{ app_dir }}/logs:/app/logs \
            {{ image }} \
            python -m src.main "$@"

    - name: Run deployment smoke test
      ansible.builtin.command: "{{ app_dir }}/bin/tsp-run --config-name test/smoke/synthetic/training_ml"
      changed_when: false
