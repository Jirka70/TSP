# TorchEEG-based raw signal augmentation configuration.
# This stage applies transformations to the continuous raw signal before epoching.


enabled: true                  # Whether to enable raw augmentation.
backend: raw_torcheeg

random_seed: 42                # Random seed for reproducibility of transformations
copies_per_sample: 1           # Number of augmented copies to create for each original recording

gaussian_noise:
  std: 0.05                    # Standard deviation of Gaussian noise added to the raw signal

mask:
  prob: 0.1                    # Probability of applying a random mask (zeroing out segments) to the signal
  ratio: 0.1                   # Ratio of the signal to be masked when RandomMask is applied (e.g., 0.1 for 10%)

sign_flip:
  prob: 0.5                    # Probability of inverting the sign (phase flip) of the signal

scale:
  prob: 0.5                    # Probability of scaling the amplitude of the signal
  min: 0.8                     # Minimum factor for amplitude scaling (e.g., 0.8)
  max: 1.2                     # Maximum factor for amplitude scaling (e.g., 1.2)
