backend: default              # Used by program logic, changing this may break the pipeline if not handled properly

# --- Raw Preprocessing Configuration ---

# Blocks can be enabled/disabled independently, based on the enabled true/false flag.

channel_selection:
  picks: [ "eeg", "eog" ]    # Channel types kept right after loading. Never add "stim": it contains the class labels
  # (label leakage). EOG is kept only for ICA EOG detection and dropped before modelling.

resampling:
  enabled: false
  sfreq: 250                 # Recommended: 250-500Hz for general analysis; 1000Hz+ for ERP/HF oscillations

high_pass_filter:
  enabled: true
  l_freq: 1.0                # 1.0Hz is recommended to remove slow drifts, especially before ICA

low_pass_filter:
  enabled: false
  h_freq: 40.0               # Common for ERPs; keep disabled if looking at high-gamma activity

notch_filter:
  enabled: true
  freqs: [ 50 ]              # 50Hz for Europe/Asia, 60Hz for North America to remove power line interference

bad_channels_interpolation:
  enabled: true              # Reconstructs signal for 'bad' channels using spherical splines

re_referencing:
  enabled: true
  method: "AVERAGE"          # Common Average Reference (CAR) - robust general-purpose reference
                             # Applied before ICA; keep enabled when ICA is on (mastoid reference otherwise
                             # puts ~85-97 % of variance into one PCA component on BNCI2014_001)
  # CSD (Laplacian) is configured in epoch_preprocessing.csd (runs after AutoReject)

ica:
  enabled: true              # The only EOG ICA in the pipeline. Runs on broadband (>= 1 Hz) data, before the
                             # paradigm 8-35 Hz band-pass, so blink/saccade energy (1-4 Hz) is still available
  n_components: 15           # Fixed count; 0.95 variance gives only ~8 components on 22-ch data (too few for EOG z-score)
  method: fastica            # FastICA is efficient; 'infomax' is a common alternative for high-density EEG
  random_state: 42           # Ensures reproducibility of the ICA decomposition
  eog_threshold: 3.0         # Z-score threshold across components; must be < sqrt(n_components - 1) to ever trigger

annotate_break:
  enabled: true
  min_break_duration: 2.5    # Automatically finds and marks periods without tasks as 'BREAK'