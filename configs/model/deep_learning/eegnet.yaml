defaults:
  - training: default
  - _self_

fold_training: false
model_name: "eegnet"

# Model configuration for EEGNet.
# Backend / training family identifier.
# Type of training
backend: eegnet

# Training data scaling (normalization). If set to "none". no input normalization will be provided
input_normalization: "per_epoch_channel"

# Number of target classes in the classification task.
# Number of output classes (e. g. 0 -> left_hand, 1 -> right_hand)
# Should match len(paradigm_config.events)
n_classes: 2

# Dropout rate used inside the training.
# Reduces overfitting of training
dropout: 0.25

# Temporal kernel length used by the first convolutional block.
# Window with size of kernel_length, which shifts over the signal and finds certain patterns
kernel_length: 16

# Number of temporal filters in the first convolutional layer.
# Neural network will learn [temporal_filters] temporal filters (alpha_rhythm, beta_rhythm, small movements, fast movements, ...)
temporal_filters: 8

# Depth multiplier used in the depthwise convolution block.
# One temporal filter could have more spatial filters (combination of signals from more electrodes)
# Spatial filter creates a new signal as a combination of more electrodes
depth_multiplier: 2

# Number of pointwise filters.
# After temporal and spatial filters the network knows: which rhythms exist and where they appear in the head
# Pointwise filter combines these two (e.g. beta_rhythm + right hemisphere = left hand movement)
# temporal_filters * depth_multiplier = pointwise_filters
pointwise_filters: 16
