# @package _global_
# Methodology demonstration scenario C (BCI Competition IV-2a, cross-session).
# Raw augmentation before the split puts derived copies of one trial into train and test; expected: LEAK-002 (blocked).

defaults:
  - /config
  - override /protocol: cross_session
  - override /split: evaulation/moabb_cross_session
  - override /evaluation: fold
  - override /raw_augmentation: raw_torcheeg
  - override /augmentation: none
  - _self_

mode: evaluation
output_dir: ./outputs/methodology

source:
  name: BNCI2014_001
  subject_ids: [1, 2, 3, 4, 5, 6, 7, 8, 9]
  session_ids: null

evaluation:
  metrics: [accuracy, balanced_accuracy, f1_macro]

epoch_preprocessing:
  ica:
    enabled: false
  autoreject:
    enabled: false
