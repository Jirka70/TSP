# @package _global_
# Methodology demonstration scenario B (BCI Competition IV-2a, cross-session).
# EEGNet fold trainer selects the best epoch on the test fold; expected: SEL-001 (blocked).

defaults:
  - /config
  - override /protocol: cross_session
  - override /split: evaulation/moabb_cross_session
  - override /evaluation: fold
  - override /raw_augmentation: none
  - override /augmentation: none
  - override /model: deep_learning/eegnet
  - override /final_trainer: deep_learning/eegnet
  - override /model_path: deep_learning/eegnet
  - _self_

mode: evaluation
output_dir: ./outputs/methodology

source:
  name: BNCI2014_001
  subject_ids: [1, 2, 3, 4, 5, 6, 7, 8, 9]
  session_ids: null

evaluation:
  metrics: [accuracy, balanced_accuracy, f1_macro]

epoch_preprocessing:
  ica:
    enabled: false
  autoreject:
    enabled: false

model:
  training:
    deterministic: true
