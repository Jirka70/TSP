# @package _global_

defaults:
  - /config
  - override /raw_augmentation: none
  - override /augmentation: none
  - override /split: basic
  - override /model: deep_learning/eegnet
  - override /final_trainer: deep_learning/eegnet
  - override /save_artifacts: default
  - override /logging: trace
  - _self_

mode: training
output_dir: ./outputs/smoke-synthetic-dl-fold

source:
  backend: synthetic
  s_freq: 128.0
  n_channels: 8
  n_trials: 24
  random_seed: 42

raw_preprocessing:
  high_pass_filter:
    enabled: false
  notch_filter:
    enabled: false
  bad_channels_interpolation:
    enabled: false
  re_referencing:
    enabled: false
  annotate_break:
    enabled: false

epoch_preprocessing:
  alignment:
    enabled: false
  ica:
    enabled: false
  autoreject:
    enabled: false

split:
  ratios:
    train: 0.7
    validation: 0.1
    test: 0.2

model:
  fold_training: true
  training:
    epochs: 1
    batch_size: 8

visualization:
  save_plots: false
  show_plots: false
