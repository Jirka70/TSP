# @package _global_

defaults:
  - /config
  - override /source: external
  - override /raw_augmentation: none
  - override /augmentation: none
  - override /split: moabb_within_session
  - override /model: machine_learning/riemannian_lda
  - override /evaluation: fold
  - override /save_artifacts: default
  - override /logging: trace
  - _self_

mode: evaluation
output_dir: ./outputs/smoke-eval-ml

source:
  subject_ids: [1]
  session_ids: null
  run_ids: null

split:
  evaluator:
    n_folds: 2

model:
  fold_training: true

visualization:
  save_plots: false
  show_plots: false
