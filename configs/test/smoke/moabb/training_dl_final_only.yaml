# @package _global_

defaults:
  - /config
  - override /source: external
  - override /raw_augmentation: none
  - override /augmentation: none
  - override /split: basic
  - override /model: deep_learning/eegnet
  - override /final_trainer: eegnet
  - override /logging: trace
  - _self_

mode: training
output_dir: ./outputs/smoke-dl-final-only

source:
  subject_ids: [1]
  session_ids: null
  run_ids: null

split:
  train_ratio: 0.7
  validation_ratio: 0.1
  test_ratio: 0.2

model:
  fold_training: false
  training:
    epochs: 2
    batch_size: 8

visualization:
  save_plots: false
  show_plots: false
