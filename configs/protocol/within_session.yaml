# --- Experiment protocol: within-session ---
# Question: does the model generalize to NEW TRIALS of an already seen session?
# Correct split: whole trials are split within each session (e.g. split=cross_validation/moabb_within_session).
# Methodology rules: PROT-001 (split must be moabb_within_session or general), GRP-001 (general split pools sessions).

task: "motor imagery classification"   # Research question / task definition
evaluation_scheme: within_session       # within_session | within_subject | cross_session | cross_subject | cross_dataset
usage: offline                          # offline | simulated_online | online
rigor: standard                         # none | exploratory | standard | publication (strictness of methodology validation)
