backend: general                 # Used by program logic, changing this may break the pipeline if not handled properly

# --- Basic Splitting Configuration ---

# This backend partitions the dataset into training, validation, and testing sets
# based on fixed percentages. It is the simplest splitting strategy.

enabled: true                  # Whether to enable basic splitting strategy.

ratios:
  train: 0.7                   # Fraction of the dataset to be used for training (0.0 - 1.0)
  validation: 0.1              # Fraction of the dataset to be used for validation (0.0 - 1.0); set to 0.0 for ML models
  test: 0.2                    # Fraction of the dataset to be used for testing (0.0 - 1.0); set to 0.0 to skip final evaluation

shuffle: true                  # Whether to shuffle the data before splitting
random_seed: 42                # Random seed to ensure reproducibility of the split
