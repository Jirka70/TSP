backend: moabb_cross_session # Used by program logic, changing this may break the pipeline if not handled properly

# --- MOABB Cross-Session Configuration ---

# This backend performs leave-one-session-out cross-validation.
# It evaluates how well a model trained on some sessions generalizes to an unseen session.

enabled: true                # Whether the cross-session splitting strategy is enabled.
exclude_validation_data_before_split: true # Whether to set aside validation data before the MOABB split
validation_ratio: 0.1        # Fraction of data to use for global validation (0.0 to 1.0)

evaluator:
  _target_: moabb.evaluations.CrossSessionSplitter # MOABB target splitter class
  cv_class: sklearn.model_selection.LeaveOneGroupOut # Scikit-learn cross-validation class
  shuffle: false             # Whether to shuffle groups. NOTE: LeaveOneGroupOut does NOT support shuffle=True.
  random_state: null         # Random seed for reproducible splits (used only if shuffle=True)
