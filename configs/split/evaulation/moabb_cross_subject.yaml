backend: moabb_cross_subject # Used by program logic, changing this may break the pipeline if not handled properly

# --- MOABB Cross-Subject Configuration ---

# This backend performs leave-one-subject-out cross-validation.
# It evaluates the model's ability to generalize to completely new, unseen subjects.
# Each fold produces train_data and test_data only — no global validation data.

evaluator:
  _target_: moabb.evaluations.CrossSubjectSplitter  # MOABB target splitter class
  cv_class: sklearn.model_selection.LeaveOneGroupOut # Scikit-learn cross-validation class
  random_state: 42           # Random seed for reproducible splits
