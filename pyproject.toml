[build-system]
requires = ["setuptools==81.0.0", "wheel==0.48.0", "packaging==26.0"]
build-backend = "setuptools.build_meta"

[project]
name = "src"
version = "0.0.4"
requires-python = ">=3.10"
dependencies = [
    # sem časem přesunout runtime dependencies z requirements.lock.txt
]

[project.optional-dependencies]
dev = [
    "pytest==9.0.2",
    "ruff==0.15.8",
    "mypy==1.19.1",
    "build==1.6.1"
]

[project.scripts]
tsp-train = "src.main:my_app"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
# Matches your requirement for line length.
line-length = 250
target-version = "py310"

[tool.ruff.lint]
select = [

]

# Specific rules to ignore
ignore = ["D", "T201", "W293"] # T201 for prints -- transform prints into logs

[tool.ruff.lint.pydocstyle]
# Enforce Google-style docstrings (Args, Returns, Raises)
convention = "google"

[tool.ruff.format]
# Formatting settings matching Black standard
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
exclude = ["src/impl/model/model_factory.py"]

[tool.mypy]
# Mypy configuration for strict type checking
python_version = "3.10"
strict = true
disallow_untyped_defs = true
no_implicit_optional = true
# Disallow the use of 'Any' type
disallow_any_generics = true
